<!-- ECharts support (adapted from community pattern: linsnotes Chart.js integration
     + al-folio echarts-setup). Loads library + renderer only on pages that use it. -->
{% if page.chart or page.charts %}
{% if page.charts %}
<script>
window.chartConfig = JSON.parse('{{ page.charts | jsonify }}');
</script>
{% else %}
<script>
window.chartConfig = [JSON.parse('{{ page.chart | jsonify | jsonify }}')];
</script>
{% endif %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="/assets/js/echarts-renderer.js" defer></script>
{% endif %}
